name: telnyx-voice-call-platform
label: Telnyx Voice Call
kind: platform
version: 0.1.0
description: >
  Telnyx Voice Call gateway adapter for Hermes Agent. Runs an aiohttp webhook
  server for Telnyx Call Control events, answers inbound calls, and uses Call
  Control speak actions to deliver Hermes replies over the phone.
author: Telnyx AI FDE
requires_env:
  - name: TELNYX_API_KEY
    description: "Telnyx API key used for Call Control API requests"
    prompt: "Telnyx API key"
    url: "https://portal.telnyx.com/#/app/api-keys"
    password: true
  - name: TELNYX_VOICE_FROM_NUMBER
    description: "Telnyx-owned E.164 caller ID used for outbound calls"
    prompt: "Voice from number"
    password: false
  - name: TELNYX_CALL_CONTROL_CONNECTION_ID
    description: "Telnyx Call Control application connection ID"
    prompt: "Call Control connection ID"
    url: "https://portal.telnyx.com/#/app/call-control/applications"
    password: false
optional_env:
  - name: TELNYX_VOICE_WEBHOOK_URL
    description: "Public webhook URL for outbound call events"
    prompt: "Public webhook URL"
    password: false
  - name: TELNYX_VOICE_API_BASE
    description: "Telnyx API base URL override (default: https://api.telnyx.com/v2)"
    prompt: "Telnyx API base URL"
    password: false
  - name: TELNYX_VOICE_WEBHOOK_HOST
    description: "Webhook bind host (default: 127.0.0.1)"
    prompt: "Webhook host"
    password: false
  - name: TELNYX_VOICE_WEBHOOK_PORT
    description: "Webhook listen port (default: 8088)"
    prompt: "Webhook port"
    password: false
  - name: TELNYX_VOICE_WEBHOOK_PATH
    description: "Webhook path (default: /webhooks/telnyx/voice)"
    prompt: "Webhook path"
    password: false
  - name: TELNYX_PUBLIC_KEY
    description: "Telnyx account public key for Ed25519 webhook signature verification"
    prompt: "Telnyx public key"
    password: true
  - name: TELNYX_VOICE_REQUIRE_SIGNATURE
    description: "Require valid Telnyx webhook signatures (recommended in production)"
    prompt: "Require webhook signature? (true/false)"
    password: false
  - name: TELNYX_VOICE_ALLOWED_USERS
    description: "Comma-separated E.164 phone numbers allowed to call the bot"
    prompt: "Allowed phone numbers"
    password: false
  - name: TELNYX_VOICE_ALLOW_ALL_USERS
    description: "Allow any caller phone number to talk to the bot (dev only)"
    prompt: "Allow all callers? (true/false)"
    password: false
  - name: TELNYX_VOICE_HOME_CHANNEL
    description: "Default E.164 phone number for cron / notification delivery by voice call"
    prompt: "Home phone number"
    password: false
  - name: TELNYX_VOICE_GREETING
    description: "Optional greeting spoken after inbound calls are answered"
    prompt: "Inbound greeting"
    password: false
  - name: TELNYX_VOICE_DEFAULT_VOICE
    description: "Default Telnyx TTS voice for call speak actions"
    prompt: "Default voice"
    password: false
  - name: TELNYX_VOICE_LANGUAGE
    description: "Default language for call speak actions (default: en-US)"
    prompt: "Language"
    password: false
  - name: TELNYX_VOICE_AUTO_PROVISION
    description: "Auto-provision Call Control app + phone number on enable (default: false)"
    prompt: "Enable auto-provisioning? (true/false)"
    password: false
  - name: TELNYX_VOICE_SIGNATURE_TOLERANCE
    description: "Webhook signature timestamp tolerance in seconds (default: 300; 0 disables freshness check)"
    prompt: "Signature tolerance seconds"
    password: false
  - name: TELNYX_VOICE_TRANSCRIPTION
    description: "Enable real-time speech transcription so the agent can hear the caller (default: true). Required for two-way conversation."
    prompt: "Enable transcription? (true/false)"
    password: false
  - name: TELNYX_VOICE_TRANSCRIPTION_ENGINE
    description: "Telnyx transcription engine: A (Google) or B (Telnyx) (default: A)"
    prompt: "Transcription engine"
    password: false
  - name: TELNYX_VOICE_TRANSCRIPTION_LANGUAGE
    description: "Language for speech transcription (default: en-US / matches TELNYX_VOICE_LANGUAGE)"
    prompt: "Transcription language"
    password: false
  - name: TELNYX_VOICE_STREAM_URL
    description: "WebSocket URL for Telnyx media streaming (e.g. wss://example.com/ws). When set, streaming_start is called automatically on call.answered."
    prompt: "Media stream WebSocket URL"
    password: false
  - name: TELNYX_VOICE_STREAM_TRACK
    description: "Which audio track to stream: inbound_track, outbound_track, or both_tracks (default: inbound_track)"
    prompt: "Stream track"
    password: false
  - name: TELNYX_VOICE_STREAM_CODEC
    description: "Audio codec for streaming: PCMU, PCMA, G722, OPUS, AMR-WB, L16, or default (default: PCMU)"
    prompt: "Stream codec"
    password: false
  - name: TELNYX_VOICE_WS_HOST
    description: "WebSocket server bind host (default: same as webhook host)"
    prompt: "WebSocket host"
    password: false
  - name: TELNYX_VOICE_WS_PORT
    description: "WebSocket server listen port (default: same as webhook port)"
    prompt: "WebSocket port"
    password: false
  - name: TELNYX_VOICE_WS_PATH
    description: "WebSocket server path for Telnyx media frames (default: /ws/telnyx/voice/stream)"
    prompt: "WebSocket path"
    password: false
