name: telnyx-voice-call-platform
label: Telnyx Voice Call
kind: platform
version: 1.0.0
description: >
  Telnyx Voice Call gateway adapter for Hermes Agent. Runs an aiohttp webhook
  server for Telnyx Call Control events, answers inbound calls, and uses Call
  Control speak actions to deliver Hermes replies over the phone.
author: Telnyx AI FDE
requires_env:
  - name: TELNYX_API_KEY
    description: "Telnyx API key used for Call Control API requests"
    prompt: "Telnyx API key"
    url: "https://portal.telnyx.com/#/app/api-keys"
    password: true
  - name: TELNYX_VOICE_FROM_NUMBER
    description: "Telnyx-owned E.164 caller ID used for outbound calls"
    prompt: "Voice from number"
    password: false
  - name: TELNYX_CALL_CONTROL_CONNECTION_ID
    description: "Telnyx Call Control application connection ID"
    prompt: "Call Control connection ID"
    url: "https://portal.telnyx.com/#/app/call-control/applications"
    password: false
optional_env:
  - name: TELNYX_VOICE_WEBHOOK_URL
    description: "Public webhook URL for outbound call events"
    prompt: "Public webhook URL"
    password: false
  - name: TELNYX_VOICE_API_BASE
    description: "Telnyx API base URL override (default: https://api.telnyx.com/v2)"
    prompt: "Telnyx API base URL"
    password: false
  - name: TELNYX_VOICE_WEBHOOK_HOST
    description: "Webhook bind host (default: 127.0.0.1)"
    prompt: "Webhook host"
    password: false
  - name: TELNYX_VOICE_WEBHOOK_PORT
    description: "Webhook listen port (default: 8088)"
    prompt: "Webhook port"
    password: false
  - name: TELNYX_VOICE_WEBHOOK_PATH
    description: "Webhook path (default: /webhooks/telnyx/voice)"
    prompt: "Webhook path"
    password: false
  - name: TELNYX_PUBLIC_KEY
    description: "Telnyx account public key for Ed25519 webhook signature verification"
    prompt: "Telnyx public key"
    password: true
  - name: TELNYX_VOICE_REQUIRE_SIGNATURE
    description: "Require valid Telnyx webhook signatures (recommended in production)"
    prompt: "Require webhook signature? (true/false)"
    password: false
  - name: TELNYX_VOICE_ALLOWED_USERS
    description: "Comma-separated E.164 phone numbers allowed to call the bot"
    prompt: "Allowed phone numbers"
    password: false
  - name: TELNYX_VOICE_ALLOW_ALL_USERS
    description: "Allow any caller phone number to talk to the bot (dev only)"
    prompt: "Allow all callers? (true/false)"
    password: false
  - name: TELNYX_VOICE_HOME_CHANNEL
    description: "Default E.164 phone number for cron / notification delivery by voice call"
    prompt: "Home phone number"
    password: false
  - name: TELNYX_VOICE_GREETING
    description: "Optional greeting spoken after inbound calls are answered"
    prompt: "Inbound greeting"
    password: false
  - name: TELNYX_VOICE_DEFAULT_VOICE
    description: "Default Telnyx TTS voice for call speak actions"
    prompt: "Default voice"
    password: false
  - name: TELNYX_VOICE_LANGUAGE
    description: "Default language for call speak actions (default: en-US)"
    prompt: "Language"
    password: false
